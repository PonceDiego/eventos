{% extends 'servicios/base.html' %}

{% block content %}
<h2 class="mb-3 text-secondary">Servicios Inactivos</h2>

<div class="card shadow-sm border-0">
  <div class="card-body p-0">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-secondary">
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th class="text-end">Acción</th>
        </tr>
      </thead>
      <tbody>
        {% for s in servicios %}
        <tr>
          <td class="fw-semibold text-muted">{{ s.nombre }}</td>
          <td class="text-muted">{{ s.descripcion }}</td>
          <td class="text-muted">${{ s.precio }}</td>
          <td class="text-end">
            <form action="{% url 'servicios:restaurar' s.pk %}" method="POST" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-success">Restaurar</button>
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">No hay servicios dados de baja.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
