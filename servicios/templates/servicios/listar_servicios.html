{% extends 'servicios/base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Servicios Activos</h2>
  <a href="{% url 'servicios:crear' %}" class="btn btn-primary">+ Nuevo Servicio</a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body p-0">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        {% for s in servicios %}
        <tr>
          <td class="fw-semibold">{{ s.nombre }}</td>
          <td>{{ s.descripcion }}</td>
          <td>${{ s.precio }}</td>
          <td class="text-end">
            <a href="{% url 'servicios:editar' s.pk %}" class="btn btn-sm btn-warning me-1">Editar</a>
            <form action="{% url 'servicios:eliminar' s.pk %}" method="POST" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">No hay servicios activos.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
