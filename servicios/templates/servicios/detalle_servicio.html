{% extends 'servicios/base.html' %}

{% block title %}{{ servicio.nombre }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="fw-bold mb-3">{{ servicio.nombre }}</h3>
                <p class="text-muted">{{ servicio.descripcion }}</p>
                <p class="fs-4 fw-bold text-primary">${{ servicio.precio }}</p>

                <a href="{% url 'home' %}" class="btn btn-secondary">Volver</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
