{% extends 'servicios/clientebase.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Clientes Activos</h2>
  <a href="{% url 'servicios:cliente_nuevo' %}" class="btn btn-primary">+ Nuevo Cliente</a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body p-0">
    <table class="table table-hover mb-0 align-middle">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Contacto</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        {% for c in clientes %}
        <tr>
          <td class="fw-semibold">{{ c.nombre }}</td>
          <td>{{ c.apellido }}</td>
          <td>{{ c.contacto }}</td>
          <td class="text-end">
            <a href="{% url 'servicios:cliente_editar' c.pk %}" class="btn btn-sm btn-warning me-1">Editar</a>
            <form action="{% url 'servicios:cliente_eliminar' c.pk %}" method="POST" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
            </form>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="text-center py-4 text-muted">No hay Clientes Activos.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
